{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="card-head">{{ t('settings') }}</div>
  <form method="post" action="/settings" class="form-grid">
    <div class="full">
      <label for="company">{{ t('appName') }}</label>
      <input id="company" name="company" class="field" value="{{ current.company }}">
    </div>
    <div>
      <label for="gstin">{{ t('gstin') }}</label>
      <input id="gstin" name="gstin" class="field" value="{{ current.gstin }}">
    </div>
    <div>
      <label for="state_code">{{ t('stateCode') }}</label>
      <input id="state_code" name="state_code" class="field" value="{{ current.state_code }}">
    </div>
    <div class="full">
      <label for="address">{{ t('note') }}</label>
      <input id="address" name="address" class="field" value="{{ current.address }}">
    </div>
    <div class="full"><button class="btn primary">{{ t('save') }}</button></div>
  </form>
</section>

<section class="card">
  <div class="card-head">{{ t('rate') }}</div>
  {% for p in products %}
  <form method="post" action="/product/rate" class="form-grid">
    <input type="hidden" name="productId" value="{{ p.id }}">
    <div class="full"><div class="row-title">{{ p.sku }}</div></div>
    <div>
      <label>{{ t('hsn') }}</label>
      <input name="hsn" class="field" value="{{ p.hsn or '' }}">
    </div>
    <div>
      <label>{{ t('rate') }}</label>
      <input name="rate" type="number" step="0.01" class="field" value="{{ p.rate or 0 }}">
    </div>
    <div>
      <label>GST %</label>
      <input name="gstRate" type="number" step="0.1" class="field" value="{{ p.gst_rate if p.gst_rate is not none else 18 }}">
    </div>
    <div class="full"><button class="btn">{{ t('save') }}</button></div>
  </form>
  {% endfor %}
</section>
{% endblock %}
