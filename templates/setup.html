{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="card-head inverse">{{ t('setup') }}</div>
  <form method="post" action="/setup" class="form-grid">
    <div class="full">
      <label for="name">{{ t('worker') }}</label>
      <input id="name" name="name" required class="field">
    </div>
    <div class="full">
      <label for="pin">{{ t('pin') }}</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" minlength="4" required class="field">
    </div>
    <div class="full"><button class="btn primary">{{ t('save') }}</button></div>
  </form>
</section>
{% endblock %}
